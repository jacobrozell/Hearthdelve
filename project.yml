name: Hearthdelve
options:
  bundleIdPrefix: com.jacobrozell
  developmentTeam: "7JT2JB89AV"
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  HearthCore:
    path: Packages/HearthCore
  HearthContent:
    path: Packages/HearthContent
  HearthRender:
    path: Packages/HearthRender
  HearthUI:
    path: Packages/HearthUI
  HearthPersistence:
    path: Packages/HearthPersistence
  HearthTelemetry:
    path: Packages/HearthTelemetry
  HearthAudio:
    path: Packages/HearthAudio
settings:
  base:
    DEVELOPMENT_TEAM: 7JT2JB89AV
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SUPPORTS_MAC_DESIGNED_FOR_IPAD: YES
schemes:
  Hearthdelve:
    build:
      targets:
        Hearthdelve: all
    run:
      config: Debug
targets:
  Hearthdelve:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Content
        buildPhase: resources
        type: folder
    dependencies:
      - package: HearthCore
        product: HearthCore
      - package: HearthContent
        product: HearthContent
      - package: HearthRender
        product: HearthRender
      - package: HearthUI
        product: HearthUI
      - package: HearthPersistence
        product: HearthPersistence
      - package: HearthTelemetry
        product: HearthTelemetry
      - package: HearthAudio
        product: HearthAudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jacobrozell.hearthdelve
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
        INFOPLIST_KEY_CFBundleDisplayName: Hearthdelve
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPAD: YES
